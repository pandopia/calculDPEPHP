# Publie l'éditeur DPE (editeur/) sur GitHub Pages :
# https://pandopia.github.io/calculDPEPHP/
# Prérequis : Settings › Pages › Source = « GitHub Actions ».
name: Éditeur DPE — GitHub Pages

on:
  push:
    branches: [main]
    paths: ['editeur/**', '.github/workflows/editeur-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editeur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editeur/package-lock.json
      - run: npm ci
      - run: npm test
      # sous-chemin du site de projet : schémas XSD et validateur sont chargés en relatif
      - run: npx ng build --base-href /calculDPEPHP/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editeur/dist/editeur/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
